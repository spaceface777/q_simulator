image: ubuntu:24.04

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends git cmake build-essential libsdl2-dev ninja-build
  - apt-get clean
  - rm -rf /var/lib/apt/lists/*

build:
  script:
    - mv settings_example.toml settings.toml
    - mv events_example.toml events.toml
    - cmake -B build -S . -G Ninja
    - cmake --build build -j
    - ./build/tests

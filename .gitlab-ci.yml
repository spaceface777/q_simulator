image: $CI_REGISTRY/2irr70-capstone-quercus-airport/system/q_vm_builder/ci

default:
  tags:
    - docker # use runner 2 since runner 1 has disk space problems

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

# A host build with clang and lld (LLVM 21 or later). ctest builds the test applets with the image's upstream Zephyr and the host
# compiler, then runs the unit, world and applet tests.
build:
  script:
    - CC=clang CXX=clang++ cmake -B build -S . -G Ninja -DQSIM_COSMOCC=OFF
    - sudo apt-get update && sudo apt-get install -y clang-format-22
    - cmake --build build -j --target format-check
    - cmake --build build -j --target all
    - ./build/tests.exe --gtest_shuffle --gtest_repeat=10
    - RUN_SLOW_TESTS=1 ctest --test-dir build -j --output-on-failure

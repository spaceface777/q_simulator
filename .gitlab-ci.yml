image: ubuntu:24.04

default:
  tags:
    - docker # use runner 2 since runner 1 has disk space problems

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends git cmake build-essential ninja-build ca-certificates
  - apt-get clean

build:
  script:
    - cp settings_example.toml settings.toml
    - cp layout_example.toml layout.toml
    - cp events_example.toml events.toml
    - cmake -B build -S . -G Ninja -DTESTING_CONSOLE_BUILD=ON
    - cmake --build build -j --target tests
    - ./build/tests

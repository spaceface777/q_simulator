image: ubuntu:24.04

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends ca-certificates
  - apt-get install -y --no-install-recommends build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
  - apt-get clean

build:
  script:
    - cp settings_example.toml settings.toml
    - cp layout_example.toml layout.toml
    - cp events_example.toml events.toml
    - cmake -B build -S . -G Ninja -DTESTING=ON
    - cmake --build build -j --target tests
    - ./build/tests

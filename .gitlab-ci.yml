image: $CI_REGISTRY/2irr70-capstone-quercus-airport/system/q_vm_builder/ci

default:
  tags:
    - docker

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

build:
  timeout: 1h
  script:
    - command -v clang-format-22 || (sudo apt-get update && sudo apt-get install -y clang-format-22)
    - python3 tools/check_sdk.py
    - python3 test/test_sdk_consistency.py
    - test -n "$ZEPHYR_BASE" && test -f "$ZEPHYR_BASE/CMakeLists.txt"
    - |
      zephyr_revision=$(cat external/q_sdk/ZEPHYR_REVISION)
      if ! git -C "$ZEPHYR_BASE" cat-file -e "$zephyr_revision^{commit}"; then
        git -C "$ZEPHYR_BASE" fetch https://github.com/spaceface777/zephyr.git "$zephyr_revision"
      fi
      # The disposable builder image contains an untracked source snapshot.
      git -C "$ZEPHYR_BASE" checkout --force --detach "$zephyr_revision"
      git -C "$ZEPHYR_BASE" clean -fd
      test "$(git -C "$ZEPHYR_BASE" rev-parse HEAD)" = "$zephyr_revision"
    - export ZEPHYR_TOOLCHAIN_VARIANT=host
    - (cd external/q_applets && ./q_sdk/qbuild sim)
    - external/q_sdk/qbuild sim
    - python3 tools/check_sdk.py
    - cmake -S . -B build -G Ninja -DTESTING_CONSOLE_BUILD=ON -DQSIM_TEST_EMBEDDED_TRACE=ON
    - cmake --build build -j --target format-check
    - cmake --build build -j
    - timeout 20m env QSIM_REQUIRE_FIRMWARE=1 RUN_SLOW_TESTS=1 ctest --test-dir build --output-on-failure
    - timeout 10m env QSIM_REQUIRE_FIRMWARE=1 build/tests --gtest_shuffle --gtest_repeat=10
    - timeout 20m env QSIM_REQUIRE_FIRMWARE=1 RUN_SLOW_TESTS=1 build/tests

# ===== Settings =====
# Contains per-run settings.
# For example layouts, check the layouts folder in the Simulation repo.

# === General ===
# The path to the router Zephyr executable.
router_path = "/home/user/airport-router/build/zephyr/zephyr.exe"

# The speed at which the simulation will be run.
# Must be above 0.
simulation_speed = 1.0

# The scale of the simulation overview.
# Must be between 0.0 and 5.0.
scale = 1.0

[module.1]
active = true # Whether this module should be started.
neighbors = [0, 0, 2] # Module id of neighbors in order of left, middle, right.
pos = [0, 0] # The (x, y) position of this module in the visualization, with the top left being (0, 0).
angle = 0 # The angle of this module in the visualization. 0 degrees = T shape. Clockwise rotation: 0 degrees = T shape, 90 degrees = ─┤.

[module.2]
active = true
neighbors = [1, 0, 3]
pos = [1, 0]
angle = 0

[module.3]
active = true
neighbors = [2, 6, 4]
pos = [2, 0]
angle = 0

[module.4]
active = true
neighbors = [3, 0, 5]
pos = [3, 0]
angle = 0

[module.5]
active = true
neighbors = [4, 0, 0]
pos = [4, 0]
angle = 0

[module.6]
active = true
neighbors = [3, 0, 7]
pos = [2, 1]
angle = 90

[module.7]
active = true
neighbors = [6, 0, 8]
pos = [2, 2]
angle = 90

[module.8]
active = true
neighbors = [7, 0, 0]
pos = [2, 3]
angle = 90
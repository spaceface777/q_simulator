# === Layout ===
# The layout of the modules used for the simulation.

# === Modules ===
[module.1]
active = true # Whether this module should be started.
neighbors = [0, 3, 2] # Module id of neighbors in order of left, middle, right.
pos = [0, 0] # The (x, y) position of this module in the visualization, with the top left being (0, 0).
angle = 0 # The angle of this module in the visualization. 0 degrees = T shape. Clockwise rotation: 0 degrees = T shape, 90 degrees = ─┤.

[module.2]
active = true
neighbors = [1, 4, 0]
pos = [1, 0]
angle = 0

[module.3]
active = true
neighbors = [4, 1, 0]
pos = [0, 1]
angle = 180

[module.4]
active = true
neighbors = [0, 2, 3]
pos = [1, 1]
angle = 180

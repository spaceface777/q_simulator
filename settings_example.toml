# The path to the router Zephyr executable.
router_path = "/home/user/airport-router/build/zephyr/zephyr.exe"

# The speed at which the simulation will be run.
# Must be above 0.
simulation_speed = 1.0

# The scale of the simulation overview.
# Must be between 0.0 and 5.0.
scale = 1.0

[module.1]
active = true # Whether this module should be started.
neighbors = [0, 2, 5] # Module id of neighbors in order of left, middle, right.
pos = [0, 4] # The (x, y) position of this module in the visualization, with the top left being (0, 0).
angle = 270 # The angle of this module in the visualization. 0 degrees = T shape. Clockwise rotation.


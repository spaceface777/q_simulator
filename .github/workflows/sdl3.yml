name: Prepare SDL3 artifacts

on:
  workflow_dispatch:
  # ci.yml builds the libraries that its worlds embed.
  workflow_call:

permissions:
  contents: read

env:
  SDL_VERSION: '3.4.20'
  SDL_RELEASE: https://github.com/libsdl-org/SDL/releases/download/release-3.4.20

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            cpu: amd64
          - runner: ubuntu-22.04-arm
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build the shared library
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols
          curl --fail --location "$SDL_RELEASE/SDL3-$SDL_VERSION.tar.gz" --output sdl.tar.gz
          echo 'f3bb06f55bed9557227a700af2ea62e49497ebdf58037732a731a5fb3ef8581f  sdl.tar.gz' | sha256sum --check
          tar -xf sdl.tar.gz
          cmake -S "SDL3-$SDL_VERSION" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build build --config Release
          mkdir assets
          cp -L build/libSDL3.so assets/libSDL3.so
          sha256sum assets/libSDL3.so | cut -d ' ' -f 1 > assets/libSDL3.so.sha256
      - name: Build the glibc loader helper
        run: |
          cc -O2 -pie -fPIC -Wl,-z,execstack tools/dlopen_helper.c -ldl -o assets/dlopen-helper
          sha256sum assets/dlopen-helper | cut -d ' ' -f 1 > assets/dlopen-helper.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.cpu }}
          path: assets/

  macos:
    runs-on: macos-15
    steps:
      - name: Extract the upstream arm64 library
        run: |
          curl --fail --location "$SDL_RELEASE/SDL3-$SDL_VERSION.dmg" --output sdl.dmg
          echo '36b7e4cefcf7d55d227b3df5e686f8f33ab34193173a976445d1b57c80009e44  sdl.dmg' | shasum -a 256 --check
          mount=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" sdl.dmg
          trap 'hdiutil detach "$mount"' EXIT
          mkdir assets
          lipo "$mount/SDL3.xcframework/macos-arm64_x86_64/SDL3.framework/SDL3" \
            -thin arm64 -output assets/libSDL3.dylib
          codesign --force --sign - --timestamp=none assets/libSDL3.dylib
          shasum -a 256 assets/libSDL3.dylib | cut -d ' ' -f 1 > assets/libSDL3.dylib.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: assets/

  windows:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract the upstream x64 library
        run: |
          curl --fail --location "$SDL_RELEASE/SDL3-$SDL_VERSION-win32-x64.zip" --output sdl.zip
          echo '368bed8b24e44ad9ea372990814f2343fcfb9e468abb7f8f4a3bc146c7304752  sdl.zip' | sha256sum --check
          mkdir assets
          unzip -j sdl.zip '*SDL3.dll' -d assets
          sha256sum assets/SDL3.dll | cut -d ' ' -f 1 > assets/SDL3.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: assets/

name: diag macos-26 fork hang
# Throwaway: why cosmo clang's fork children spin in libSystem's atfork child
# handlers on macos-26 (arm64). Scripts in diag/.
on: push
permissions:
  contents: read
env:
  COSMOCC_INSTALL: https://gitlab.tue.nl/20223853/cosmopolitan-distribution-builder-test/-/releases/permalink/latest/downloads/install.sh
jobs:
  segprobe:
    name: segprobe2 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Which loader layouts does exec accept
        run: |
          D="$RUNNER_TEMP/diag"; mkdir -p "$D"
          sw_vers | tr '\n' ' '; echo
          diag/segprobe2.sh "$D/seg" 2>&1 | tee "$D/segprobe2.txt"
          ./"$D"/seg/d5 > /dev/null 2>&1; f=$(ls "$D"/seg/d0); start=$(date "+%Y-%m-%d %H:%M:%S"); "$D/seg/d0"; sleep 2
          log show --style compact --start "$start" 2>/dev/null | grep -iE "d0|exec|load|macho|shared region|AMFI|cs_|mach-o" | grep -vE "xpc:connection|log run" | head -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segprobe2-${{ matrix.os }}
          path: ${{ runner.temp }}/diag
          retention-days: 5

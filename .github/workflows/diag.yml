name: diag macos-26 fork hang
# Throwaway: why cosmo clang's fork children spin in libSystem's atfork child
# handlers on macos-26 (arm64). Scripts in diag/.
on: push
permissions:
  contents: read
env:
  COSMOCC_INSTALL: https://gitlab.tue.nl/20223853/cosmopolitan-distribution-builder-test/-/releases/permalink/latest/downloads/install.sh
jobs:
  segprobe:
    name: segprobe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Which zero-fill segments does exec accept
        run: |
          D="$RUNNER_TEMP/diag"; mkdir -p "$D"
          sw_vers
          diag/segprobe.sh "$D/seg" 2>&1 | tee "$D/segprobe.txt" | grep -E "^segment at|error"
          echo "== kernel log around the a4/b3 runs"; grep -vE "^segment at" "$D/segprobe.txt" | tail -40
          printf '#include <stdlib.h>\n#include <stdio.h>\n#include <unistd.h>\nint main(void){char c[64];snprintf(c,64,"vmmap -w %d",getpid());return system(c);}\n' > "$D/vm.c"
          /usr/bin/cc -w -o "$D/vm" "$D/vm.c" && "$D/vm" > "$D/vmmap-plain.txt" 2>&1
          echo "== plain process: guard and shared-region-like regions"
          grep -E "^(Guard|unused|STACK GUARD|shared)|SM=NUL|[0-9a-f]+-(fc0000000|1000000000|7000000000)" "$D/vmmap-plain.txt" | cut -c1-140 | head -12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segprobe-${{ matrix.os }}
          path: ${{ runner.temp }}/diag
          retention-days: 5

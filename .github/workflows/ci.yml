name: Simulator CI

# cosmocc: every runner image installs the latest cosmocc release with its own installer and puts only the
# bundle on PATH. The bundle's git, west, CMake, Ninja, Python and clang then fetch upstream Zephyr,
# build the simulator, the test applets and their worlds, and run the whole ctest suite, from bash,
# cmd or PowerShell. The bundle and the build are in directories with spaces in their names.
# native: every Ubuntu image builds with the host's clang and lld and upstream Zephyr, without
# anything from cosmocc, and runs the suite plainly and with the address and undefined behaviour
# sanitizers.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The latest cosmocc release, which users install too, with its own installer.
  COSMOCC_RELEASE: https://gitlab.tue.nl/20223853/cosmopolitan-distribution-builder-test/-/releases/permalink/latest/downloads
  ZEPHYR: v4.5.0
  PYTHONUNBUFFERED: '1'

jobs:
  sdl3:
    uses: ./.github/workflows/sdl3.yml

  cosmocc:
    name: cosmocc (${{ matrix.os }}, ${{ matrix.shell }})
    needs: [sdl3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - macos-15-intel
          - macos-26-intel
          - macos-15
          - macos-26
          - xcode-27
        shell: [bash]
        # Windows on Arm runs the bundle's x86-64 programs under emulation.
        include:
          - { os: windows-2022, shell: cmd }
          - { os: windows-2025, shell: pwsh }
          - { os: windows-11-arm, shell: cmd }
          - { os: windows-11-vs2026-arm, shell: pwsh }
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source line endings, and name the directories
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          "COSMOCC_DIR=$(Join-Path $env:RUNNER_TEMP 'cosmo cc')" >> $env:GITHUB_ENV
          "BUILD=$(Join-Path $env:RUNNER_TEMP 'build dir')" >> $env:GITHUB_ENV
          "ZEPHYR_BASE=$(Join-Path $env:GITHUB_WORKSPACE zephyrproject zephyr)" >> $env:GITHUB_ENV

      - uses: actions/checkout@v5
        with:
          path: simulator
          submodules: true
          persist-credentials: false

      - name: Install cosmocc
        if: runner.os != 'Windows'
        run: |
          # Some Linux images hand every MZ file, and so every APE program, to Mono through
          # binfmt_misc. Turn such handlers off: the bundle's programs start through its APE loader.
          for handler in /proc/sys/fs/binfmt_misc/*; do
            if grep -qs '^magic 4d5a' "$handler"; then echo 0 | sudo tee "$handler" > /dev/null; fi
          done
          curl -fsSL "$COSMOCC_RELEASE/install.sh" | sh -s -- --dir "$COSMOCC_DIR"

      - name: Install cosmocc
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "$env:COSMOCC_RELEASE/install.ps1" | iex

      - name: Select the SDL3 platform
        run: |
          # cosmocc on Windows makes x86-64 programs, which Windows on Arm runs under emulation.
          os=$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS")
          cpu=amd64
          [[ "$RUNNER_ARCH" == ARM64 && "$RUNNER_OS" != Windows ]] && cpu=arm64
          echo "PLATFORM=$os-$cpu" >> "$GITHUB_ENV"

      # Intel macOS runs headless only, so it has no SDL3.
      - uses: actions/download-artifact@v4
        if: env.PLATFORM != 'macos-amd64'
        with:
          name: ${{ env.PLATFORM }}
          path: ${{ runner.temp }}/sdl3

      - name: Build and test (bash)
        if: matrix.shell == 'bash'
        run: |
          . "$COSMOCC_DIR/activate" --path=replace
          git clone --depth 1 --branch "$ZEPHYR" https://github.com/zephyrproject-rtos/zephyr "$ZEPHYR_BASE"
          (cd "$ZEPHYR_BASE/.." && west init -l zephyr)
          sdl3=()
          [[ -d "$RUNNER_TEMP/sdl3" ]] && sdl3=(-DQSIM_SDL3_ASSETS="$RUNNER_TEMP/sdl3")
          cmake -S simulator -B "$BUILD" -G Ninja "${sdl3[@]}"
          cmake --build "$BUILD"
          cmake --build "$BUILD" --target format-check
          ctest --test-dir "$BUILD" -j 4 --output-on-failure

      # Windows paths with backslashes, as a user types them.
      - name: Build and test (cmd)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          call "%COSMOCC_DIR%\activate.bat" --path=replace || exit /b 1
          git clone --depth 1 --branch %ZEPHYR% https://github.com/zephyrproject-rtos/zephyr "%ZEPHYR_BASE%" || exit /b 1
          pushd "%ZEPHYR_BASE%\.." || exit /b 1
          west init -l zephyr || exit /b 1
          popd
          cmake -S simulator -B "%BUILD%" -G Ninja "-DQSIM_SDL3_ASSETS=%RUNNER_TEMP%\sdl3" || exit /b 1
          cmake --build "%BUILD%" || exit /b 1
          ctest --test-dir "%BUILD%" -j 4 --output-on-failure || exit /b 1

      - name: Build and test (PowerShell)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          function Run { & $args[0] $args[1..($args.Count - 1)]; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          . "$env:COSMOCC_DIR\activate.ps1" --path=replace
          Run git clone --depth 1 --branch $env:ZEPHYR https://github.com/zephyrproject-rtos/zephyr $env:ZEPHYR_BASE
          Push-Location "$env:ZEPHYR_BASE\.."
          Run west init -l zephyr
          Pop-Location
          Run cmake -S simulator -B $env:BUILD -G Ninja "-DQSIM_SDL3_ASSETS=$env:RUNNER_TEMP\sdl3"
          Run cmake --build $env:BUILD
          Run ctest --test-dir $env:BUILD -j 4 --output-on-failure

  native:
    name: native${{ matrix.sanitize && ', sanitizers' || '' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
        sanitize: [false]
        include:
          - { os: ubuntu-26.04, sanitize: true }
          - { os: ubuntu-26.04-arm, sanitize: true }
    env:
      CC: clang
      CXX: clang++
      # libc++: the older images' libstdc++ lacks parts of C++23.
      CXXFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install LLVM 21 or later, Zephyr and the system SDL3
        run: |
          # lld before 21 crashes relinking Zephyr's relocatable output: older images take LLVM
          # from apt.llvm.org. SDL3 is packaged from Ubuntu 25.04 on.
          if [[ "${{ matrix.os }}" == ubuntu-2[24].04* ]]; then
            curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 21
            sudo apt-get install -y libc++-21-dev libclang-rt-21-dev
            echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y clang lld llvm libc++-dev libclang-rt-dev libsdl3-0
          fi
          sudo apt-get install -y ninja-build
          python -m pip install --quiet west
          git clone --quiet --depth 1 --branch "$ZEPHYR" https://github.com/zephyrproject-rtos/zephyr \
            "$RUNNER_TEMP/zephyrproject/zephyr"
          python -m pip install --quiet -r "$RUNNER_TEMP/zephyrproject/zephyr/scripts/requirements-base.txt"
          (cd "$RUNNER_TEMP/zephyrproject" && west init -l zephyr)
          echo "ZEPHYR_BASE=$RUNNER_TEMP/zephyrproject/zephyr" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DQSIM_COSMOCC=OFF -DENABLE_SANITIZERS=${{ matrix.sanitize && 'ON' || 'OFF' }}
          cmake --build build

      - name: Test
        run: |
          # Ubuntu 22.04's glibc has no frame pointers, so the crash report of an abort() cannot walk out
          # of the C library to the applet's source line. That one check needs a newer host libc.
          skip=()
          [[ "${{ matrix.os }}" == ubuntu-22.04* ]] && skip=(-E '^applet\.crash\.abort$')
          RUN_SLOW_TESTS=1 ctest --test-dir build -j 4 --output-on-failure "${skip[@]}"

      - name: Check that the build used nothing from cosmocc
        run: |
          # No cosmocc program or APE loader, nothing from cosmocc in what the build and Zephyr wrote,
          # and native executables, not APE files.
          traces=$(command -v cosmocc ape; compgen -G "$HOME/.ape*"
            find build test/applets/build_sim_host test/applets/out/host "$HOME/.cache" \
              \( -iname '*cosmocc*' -o -iname '*cosmopolitan*' \) 2>/dev/null
            grep -rIil --include=CMakeCache.txt cosmocc_toolchain build test/applets/build_sim_host) || true
          [[ -z "$traces" ]] || { echo "$traces"; exit 1; }
          file build/tests.exe | grep -q ELF || { file build/tests.exe; exit 1; }

name: Simulator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-toolchain:
    name: Assemble the Windows toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore pinned toolchain downloads
        uses: actions/cache@v4
        with:
          path: windows-toolchain-cache
          # The cache also holds GNU ld, which assemble.py builds from source.
          key: windows-toolchain-${{ hashFiles('tools/windows_sdk/components.json', 'tools/windows_sdk/assemble.py') }}

      - name: Assemble the arm64 and x86_64 toolchain ZIPs
        run: >-
          python3 tools/windows_sdk/assemble.py --cache windows-toolchain-cache
          --output dist/windows-toolchain --sources

      - name: Upload the toolchain ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain
          retention-days: 14
          compression-level: 0
          path: |
            dist/windows-toolchain/*.zip
            dist/windows-toolchain/*.zip.sha256

      - name: Upload the source of the toolchain's GPL programs
        uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain-sources
          retention-days: 14
          compression-level: 0
          path: dist/windows-toolchain/sources/

  simulator:
    name: Build and test (${{ matrix.os }})
    needs: windows-toolchain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - windows-2022
          - windows-2025
          - windows-11-arm
          - windows-11-vs2026-arm
          - macos-15-intel
          - macos-26-intel
          - macos-15
          - macos-26
          - xcode-27
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows-') && 'pwsh' || 'bash' }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CMAKE_POLICY_VERSION_MINIMUM: '3.20'
      ZEPHYR_TOOLCHAIN_VARIANT: host
      QSIM_REQUIRE_FIRMWARE: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Windows Arm uses x64 Python so the build-tool wheels run under emulation.
          architecture: ${{ runner.os == 'Windows' && 'x64' || runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install Python build tools
        run: python -m pip install "cmake>=3.28,<4" ninja "clang-format>=22,<23" west

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Jammy's default repositories do not provide a recent C++23 compiler.
          if [[ "${{ matrix.os }}" == ubuntu-22.04* ]]; then
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 make device-tree-compiler gperf pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libegl-dev libgl-dev libudev-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install dtc gperf pkgconf
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # Firmware and simulator must both be i686. Windows Arm runs these under emulation.
      # windows-2022 keeps testing the UCRT/POSIX/DWARF GCC toolchain documented in the SDK.
      - name: Install Windows MinGW toolchain
        if: matrix.os == 'windows-2022'
        run: |
          $release = '16.2.0posix-14.0.0-ucrt-r2'
          $archive = 'winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip'
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$release/$archive"
          $download = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest $url -OutFile $download
          $expected = '8d498c1a07f391d05f71e067cd2fbfc3a7096f23bba999b9fbbb929bddce4bd5'
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne $expected) {
            throw 'MinGW download checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'winlibs'
          Expand-Archive $download -DestinationPath $destination
          $bin = Join-Path $destination 'mingw32/bin'
          $bin >> $env:GITHUB_PATH
          # Prefer the Python-installed CMake/Ninja over the copies in WinLibs.
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> $env:GITHUB_PATH
          "CC=$bin/gcc.exe" >> $env:GITHUB_ENV
          "CXX=$bin/g++.exe" >> $env:GITHUB_ENV

      # The other Windows runners use the LLVM-MinGW toolchain ZIP for their own architecture:
      # its compiler runs natively on Windows on Arm, and only the built programs are emulated.
      - name: Download the Windows toolchain
        if: runner.os == 'Windows' && matrix.os != 'windows-2022'
        uses: actions/download-artifact@v4
        with:
          name: windows-toolchain
          path: ${{ runner.temp }}/windows-toolchain

      - name: Install and check the Windows LLVM-MinGW toolchain
        if: runner.os == 'Windows' && matrix.os != 'windows-2022'
        run: |
          $hostArch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x86_64' }
          $zip = Get-ChildItem "$env:RUNNER_TEMP/windows-toolchain/*-$hostArch.zip" | Select-Object -First 1
          $expected = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash -ne $expected) {
            throw 'Toolchain ZIP checksum mismatch'
          }
          # The toolchain must work from any folder: check it in one whose name has a space,
          # then again after moving it to the folder without spaces that Zephyr requires.
          $first = Join-Path $env:RUNNER_TEMP 'tool chain'
          Expand-Archive $zip.FullName -DestinationPath $first
          $extracted = (Get-ChildItem $first -Directory | Select-Object -First 1).FullName
          & "$extracted/bin/cmake.exe" -P "$extracted/selftest/run.cmake"
          if ($LASTEXITCODE) { throw 'Toolchain self-test failed' }
          $root = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Move-Item $extracted $root
          & "$root/bin/cmake.exe" -P "$root/selftest/run.cmake"
          if ($LASTEXITCODE) { throw 'Toolchain self-test failed after moving the toolchain' }
          # The toolchain's CMake 4 and Ninja come before the Python-installed ones.
          "$root/i686-w64-mingw32/bin" >> $env:GITHUB_PATH
          "$root/bin" >> $env:GITHUB_PATH
          "CC=i686-w64-mingw32-clang" >> $env:GITHUB_ENV
          "CXX=i686-w64-mingw32-clang++" >> $env:GITHUB_ENV
          "ZEPHYR_TOOLCHAIN_VARIANT=host/llvm" >> $env:GITHUB_ENV

      - name: Restore pinned Zephyr workspace
        uses: actions/cache@v4
        with:
          path: .ci-zephyr
          key: zephyr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('external/q_sdk/ZEPHYR_REVISION') }}-v1

      - name: Prepare Zephyr at the SDK revision
        run: python tools/ci.py zephyr

      - name: Check SDK and Python build tests
        run: python tools/ci.py python-tests

      - name: Build all applets and simulator probes
        timeout-minutes: 30
        run: python tools/ci.py firmware

      - name: Configure GUI, scenario runner, and full test suite
        run: python tools/ci.py configure

      - name: Check formatting
        run: cmake --build build --target format-check

      - name: Build simulator and tests
        run: cmake --build build

      - name: Run simulator smoke checks and real scenario
        timeout-minutes: 5
        run: python tools/ci.py smoke

      - name: Run basic test suite
        timeout-minutes: 5
        run: python tools/ci.py test

      - name: Run ten shuffled repetitions
        timeout-minutes: 15
        run: python tools/ci.py repeat

      - name: Run full suite including slow tests
        timeout-minutes: 20
        env:
          RUN_SLOW_TESTS: '1'
        run: python tools/ci.py test

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/ci-results/
            build/Testing/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build_sim/**/CMakeFiles/CMakeConfigureLog.yaml
            build_sim/**/zephyr/NSI/nsi_entries.order
            external/q_applets/build_sim/**/CMakeFiles/CMakeConfigureLog.yaml
            external/q_applets/build_sim/**/zephyr/NSI/nsi_entries.order

      - name: Upload simulator binaries and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/simulation*
            build/tests*
            build/*.dll
            build/*.dylib
            build/*.so*
            build/_deps/sdl3-build/*.dylib
            build/_deps/sdl3-build/*.so*
            build/*_example.toml
            external/q_applets/out/*.dll
            out/*.dll
            scenarios/
            layouts/

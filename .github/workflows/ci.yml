name: Simulator CI

# cosmocc: every runner image installs the pinned cosmocc bundle and puts only the bundle on PATH. The
# bundle's git, west, CMake, Ninja and Python then fetch and patch Zephyr, build the simulator, the
# test applets and their worlds, and run the whole ctest suite, from bash, cmd or PowerShell.
# native: every Ubuntu image builds with the host compiler, host tools and upstream Zephyr, without
# anything from cosmocc, and runs the suite plainly and with the address and undefined behaviour
# sanitizers.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned cosmocc release, mirrored from its GitLab project. SHA256SUMS lists every asset.
  COSMOCC_URL: https://github.com/spaceface777/q_simulator/releases/download/cosmocc-2026.11.17-46
  COSMOCC_SUMS_SHA256: 942453f58f2b5b9a3365045e6c2bc07157a21e8d578a541b847e667f26136b88
  ZEPHYR_COSMOCC: v4.5.0
  ZEPHYR_NATIVE: v4.4.1
  PYTHONUNBUFFERED: '1'

jobs:
  sdl3:
    uses: ./.github/workflows/sdl3.yml

  cosmocc:
    name: cosmocc (${{ matrix.os }}, ${{ matrix.shell }})
    needs: [sdl3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - macos-15-intel
          - macos-26-intel
          - macos-15
          - macos-26
          - xcode-27
        shell: [bash]
        include:
          - { os: windows-2022, shell: cmd }
          - { os: windows-2025, shell: pwsh }
          - { os: windows-11-arm, shell: cmd }
          - { os: windows-11-vs2026-arm, shell: pwsh }
    env:
      # Not yet in directories with spaces in their names: GCC's lto-wrapper does not quote the
      # compiler's path, Zephyr names sections after source paths, which GCC does not quote, and the
      # native simulator's makefile takes paths for words.
      QS_SOURCE: source
      QS_BUILD: build
      QS_ZEPHYR: zephyrproject
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          path: ${{ env.QS_SOURCE }}
          submodules: true
          persist-credentials: false

      - name: Install cosmocc
        if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --remote-name-all \
            "$COSMOCC_URL/SHA256SUMS" "$COSMOCC_URL/cosmocc.tar.xz" "$COSMOCC_URL/install.sh"
          # macOS's sha256sum lacks the GNU options.
          sha256=(sha256sum); [[ "$RUNNER_OS" == macOS ]] && sha256=(shasum -a 256)
          "${sha256[@]}" --check <<< "$COSMOCC_SUMS_SHA256  SHA256SUMS"
          "${sha256[@]}" --check --ignore-missing SHA256SUMS
          sh install.sh --archive cosmocc.tar.xz --dir "$RUNNER_TEMP/cosmocc"
          echo "COSMOCC_DIR=$RUNNER_TEMP/cosmocc" >> "$GITHUB_ENV"
          # Some Linux images hand every MZ file to Mono through binfmt_misc. Register the APE loader for
          # APE's more specific magic, which the kernel then checks first.
          if [[ "$RUNNER_OS" == Linux && ! -e /proc/sys/fs/binfmt_misc/APE ]]; then
            sudo cp "$RUNNER_TEMP/cosmocc/bin/ape-$(uname -m).elf" /usr/bin/ape
            sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          fi

      - name: Install cosmocc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          foreach ($file in 'SHA256SUMS', 'cosmocc.tar.xz', 'bsdtar', 'install.ps1') {
            Invoke-WebRequest -UseBasicParsing -Uri "$env:COSMOCC_URL/$file" -OutFile $file
          }
          $sums = @{ 'SHA256SUMS' = $env:COSMOCC_SUMS_SHA256 }
          foreach ($line in Get-Content SHA256SUMS) { $hash, $name = $line -split '\s+', 2; $sums[$name] = $hash }
          foreach ($file in 'SHA256SUMS', 'cosmocc.tar.xz', 'bsdtar', 'install.ps1') {
            if ((Get-FileHash -Algorithm SHA256 $file).Hash -ne $sums[$file]) { throw "checksum mismatch: $file" }
          }
          Move-Item bsdtar bsdtar.exe
          $env:COSMOCC_ARCHIVE = "$env:RUNNER_TEMP\cosmocc.tar.xz"
          $env:COSMOCC_BSDTAR = "$env:RUNNER_TEMP\bsdtar.exe"
          $env:COSMOCC_DIR = "$env:RUNNER_TEMP\cosmocc"
          ./install.ps1
          "COSMOCC_DIR=$env:COSMOCC_DIR" >> $env:GITHUB_ENV

      - name: Select the SDL3 platform
        run: |
          # cosmocc on Windows makes x86-64 programs, which Windows on Arm runs under emulation.
          os=$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS")
          cpu=amd64
          [[ "$RUNNER_ARCH" == ARM64 && "$RUNNER_OS" != Windows ]] && cpu=arm64
          echo "PLATFORM=$os-$cpu" >> "$GITHUB_ENV"

      # Intel macOS runs headless only, so it has no SDL3.
      - uses: actions/download-artifact@v4
        if: env.PLATFORM != 'macos-amd64'
        with:
          name: ${{ env.PLATFORM }}
          path: ${{ runner.temp }}/sdl3

      - name: Build and test (bash)
        if: matrix.shell == 'bash'
        run: |
          . "$COSMOCC_DIR/activate" --path=replace
          export ZEPHYR_BASE="$RUNNER_TEMP/$QS_ZEPHYR/zephyr"
          git clone --quiet --depth 1 --branch "$ZEPHYR_COSMOCC" https://github.com/zephyrproject-rtos/zephyr "$ZEPHYR_BASE"
          git -C "$ZEPHYR_BASE" apply "$GITHUB_WORKSPACE/$QS_SOURCE/q_sdk/patches/zephyr-$ZEPHYR_COSMOCC-cosmocc.patch"
          (cd "$ZEPHYR_BASE/.." && west init -l zephyr)
          sdl3=()
          [[ -d "$RUNNER_TEMP/sdl3" ]] && sdl3=(-DQSIM_SDL3_ASSETS="$RUNNER_TEMP/sdl3")
          cmake -S "$GITHUB_WORKSPACE/$QS_SOURCE" -B "$RUNNER_TEMP/$QS_BUILD" -G Ninja "${sdl3[@]}"
          cmake --build "$RUNNER_TEMP/$QS_BUILD"
          ctest --test-dir "$RUNNER_TEMP/$QS_BUILD" -j 4 --output-on-failure

      # Windows paths with backslashes, as a user types them.
      - name: Build and test (cmd)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          call "%COSMOCC_DIR%\activate.bat" --path=replace
          set "ZEPHYR_BASE=%RUNNER_TEMP%\%QS_ZEPHYR%\zephyr"
          set "SOURCE=%GITHUB_WORKSPACE%\%QS_SOURCE%"
          set "BUILD=%RUNNER_TEMP%\%QS_BUILD%"
          git clone --quiet --depth 1 --branch %ZEPHYR_COSMOCC% https://github.com/zephyrproject-rtos/zephyr "%ZEPHYR_BASE%" || exit /b 1
          git -C "%ZEPHYR_BASE%" apply "%SOURCE%\q_sdk\patches\zephyr-%ZEPHYR_COSMOCC%-cosmocc.patch" || exit /b 1
          pushd "%ZEPHYR_BASE%\.." || exit /b 1
          west init -l zephyr || exit /b 1
          popd
          cmake -S "%SOURCE%" -B "%BUILD%" -G Ninja "-DQSIM_SDL3_ASSETS=%RUNNER_TEMP%\sdl3" || exit /b 1
          cmake --build "%BUILD%" || exit /b 1
          ctest --test-dir "%BUILD%" -j 4 --output-on-failure || exit /b 1

      - name: Build and test (PowerShell)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          function Run { & $args[0] $args[1..($args.Count - 1)]; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          . "$env:COSMOCC_DIR\activate.ps1" --path=replace
          $env:ZEPHYR_BASE = "$env:RUNNER_TEMP\$env:QS_ZEPHYR\zephyr"
          $source = "$env:GITHUB_WORKSPACE\$env:QS_SOURCE"
          $build = "$env:RUNNER_TEMP\$env:QS_BUILD"
          Run git clone --quiet --depth 1 --branch $env:ZEPHYR_COSMOCC https://github.com/zephyrproject-rtos/zephyr $env:ZEPHYR_BASE
          Run git -C $env:ZEPHYR_BASE apply "$source\q_sdk\patches\zephyr-$env:ZEPHYR_COSMOCC-cosmocc.patch"
          Push-Location "$env:ZEPHYR_BASE\.."
          Run west init -l zephyr
          Pop-Location
          Run cmake -S $source -B $build -G Ninja "-DQSIM_SDL3_ASSETS=$env:RUNNER_TEMP\sdl3"
          Run cmake --build $build
          Run ctest --test-dir $build -j 4 --output-on-failure

  native:
    name: native${{ matrix.sanitize && ', sanitizers' || '' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
        sanitize: [false]
        include:
          - { os: ubuntu-26.04, sanitize: true }
          - { os: ubuntu-26.04-arm, sanitize: true }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install a C++23 compiler, Zephyr and the system SDL3
        run: |
          # Older images need GCC 14, from the toolchain PPA on 22.04. SDL3 is packaged from 25.04 on.
          if [[ "${{ matrix.os }}" == ubuntu-22.04* ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          if [[ "${{ matrix.os }}" == ubuntu-2[24].04* ]]; then
            sudo apt-get install -y gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi
          sudo apt-get install -y ninja-build libsdl3-0 || sudo apt-get install -y ninja-build
          python -m pip install --quiet west "clang-format>=22,<23"
          git clone --quiet --depth 1 --branch "$ZEPHYR_NATIVE" https://github.com/zephyrproject-rtos/zephyr \
            "$RUNNER_TEMP/zephyrproject/zephyr"
          python -m pip install --quiet -r "$RUNNER_TEMP/zephyrproject/zephyr/scripts/requirements-base.txt"
          (cd "$RUNNER_TEMP/zephyrproject" && west init -l zephyr)
          echo "ZEPHYR_BASE=$RUNNER_TEMP/zephyrproject/zephyr" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DQSIM_COSMOCC=OFF -DENABLE_SANITIZERS=${{ matrix.sanitize && 'ON' || 'OFF' }}
          cmake --build build
          cmake --build build --target format-check

      - name: Test
        run: |
          # Ubuntu 22.04's glibc has no frame pointers, so the crash report of an abort() cannot walk out
          # of the C library to the applet's source line. That one check needs a newer host libc.
          skip=()
          [[ "${{ matrix.os }}" == ubuntu-22.04* ]] && skip=(-E '^applet\.crash\.abort$')
          RUN_SLOW_TESTS=1 ctest --test-dir build -j 4 --output-on-failure "${skip[@]}"

      - name: Check that the build used nothing from cosmocc
        run: |
          # No cosmocc program or APE loader, nothing from cosmocc in what the build and Zephyr wrote,
          # and native executables, not APE files.
          traces=$(command -v cosmocc ape; compgen -G "$HOME/.ape*"
            find build test/applets/build_sim_host test/applets/out/host "$HOME/.cache" \
              \( -iname '*cosmocc*' -o -iname '*cosmopolitan*' \) 2>/dev/null
            grep -rIil --include=CMakeCache.txt cosmocc_toolchain build test/applets/build_sim_host) || true
          [[ -z "$traces" ]] || { echo "$traces"; exit 1; }
          for program in build/tests.exe test/applets/out/host/*.exe; do
            file "$program" | grep -q ELF || { file "$program"; exit 1; }
          done

name: Linux LLVM evaluation
on:
  workflow_dispatch:
  push:
    branches: [experiment/linux-llvm]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Build and test inside a compiler-isolated Linux container
        run: docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 bash .github/llvm-evaluation/run.sh

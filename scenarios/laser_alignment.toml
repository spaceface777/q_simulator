# ===== Scenario: laser_alignment =====
# Exercises alignment, RFID brightness, misalignment, and both recovery paths without a GUI.
#
# Run it with:
#   ./build/simulation-scenario -l layouts/one_module.toml \
#       -b external/q_applets/out/laser_alignment.exe scenarios/laser_alignment.toml

[scenario]
duration = "16s"
properties = "laser_alignment.spec"

# A tag arrives at the reader and later leaves. Because this applet never drives a belt, it stays
# under the reader and cleanly isolates the RFID-controlled brightness behavior.
[tub.tag_arrives]
time = 4.0
id = 1
module = 1
removed = 13.0
uid = 0x01000000000000
payload = [0xDEADBEEF]

# A second tub directly blocks the left beam, making the misaligned branch reachable without belt
# motion, then leaves so the recovery behavior is observable.
[tub.blocks_the_left_beam]
time = 7.0
id = 2
module = 1
position = "left_laser"
removed = 10.0
uid = 0x02000000000000
payload = []
